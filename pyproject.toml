[project]
name = "jepa"
version = "0.1.0"
description = "A compact JEPA research core for time-series experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "pillow>=10.0",
]

[project.scripts]
jepa = "jepa.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [".github/**", "AGENTS.md", "TODOS.md", "configs/**", "docs/**", "scripts/**"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/jepa"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
