data:
  batch_size: 256
  color_jitter_strength: 0.0
  crop_scale: [0.3, 1.0]
  crop_size: 64
  image_folder: tiny-imagenet-200
  num_workers: 8
  pin_mem: true
  root_path: ../../data
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false

logging:
  folder: ../../outputs/official_ijepa_q17/cloud_tiny_vits4_q17_matched_g5_ep300_b256_q64
  write_tag: jepa
  checkpoint_freq: 50

mask:
  allow_overlap: false
  aspect_ratio: [0.75, 1.5]
  enc_mask_scale: [0.85, 1.0]
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 4
  pred_mask_scale: [0.15, 0.2]

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 6
  pred_emb_dim: 192
  read_checkpoint: null
  use_bfloat16: true

optimization:
  ema: [0.996, 1.0]
  epochs: 300
  final_lr: 1.0e-6
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 5.0e-4
  start_lr: 1.0e-4
  warmup: 40
  weight_decay: 0.04

residual_q17:
  enabled: true
  gradient_ratio: 0.05
  mode: matched
  transforms: [flip, blur, color]
  batch_size: 64
  statistics_decay: 0.99
  epsilon: 1.0e-6
  operator_lr: 1.0e-3
  operator_weight_decay: 1.0e-4
  blur_sigma: 1.0
  color_strength: 0.2
