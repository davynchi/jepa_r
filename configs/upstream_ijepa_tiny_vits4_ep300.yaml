data:
  batch_size: 1024
  color_jitter_strength: 0.0
  crop_scale:
    - 0.3
    - 1.0
  crop_size: 64
  image_folder: tiny-imagenet-200/tiny-imagenet-200
  num_workers: 10
  pin_mem: true
  root_path: ../jepa_r/data
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false

logging:
  folder: ../jepa_r/outputs/upstream_ijepa_tiny/tiny_vits_p4_seed0_ep300_b1024
  write_tag: jepa

mask:
  allow_overlap: false
  aspect_ratio:
    - 0.75
    - 1.5
  enc_mask_scale:
    - 0.85
    - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 4
  pred_mask_scale:
    - 0.15
    - 0.2

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 6
  pred_emb_dim: 192
  read_checkpoint: null
  use_bfloat16: true

optimization:
  ema:
    - 0.996
    - 1.0
  epochs: 300
  final_lr: 0.000001
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0005
  start_lr: 0.0001
  warmup: 40
  weight_decay: 0.04
