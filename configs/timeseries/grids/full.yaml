# Grid axes consumed by scripts/run_temporal_grid.py --preset full.
# This is NOT a TemporalExperimentConfig; it is a small enumeration spec.
# Never launched implicitly by the default training command.
base_config: configs/timeseries/hierarchy_full.yaml
seeds: [0, 1, 2, 3, 4]
model_types: [linear, nonlinear]
observation_modes: [linear, nonlinear]
entity_switch_probabilities: [0.01, 0.05, 0.20, 0.50]
prediction_horizons: [1, 4, 8]
# shuffled_same_entity is an *oracle* control (reported as oracle_same_entity in
# analysis) -- it uses true entity labels to build pairs, so a strong result
# there is not evidence of unsupervised discovery on its own. See
# jepa.data.timeseries.entity_context.make_temporal_pairs's docstring.
target_pairings: [temporal, shuffled, shuffled_same_entity]
include_random_baseline: true
# latent_dims / context_rhos / sg_ema_combinations are intentionally left at
# their single-value defaults here (see configs/timeseries/grids/full_bottleneck.yaml
# for the dedicated, smaller grid that sweeps latent_dim/context_rho/SG-EMA) --
# adding them here as full axes would multiply this already-large grid several
# times over.

hierarchical:
  base_config: configs/timeseries/hierarchy_explicit.yaml
  entity_switch_probabilities: [0.01, 0.05, 0.20]
  short_horizon: 1
  long_horizon: 8
