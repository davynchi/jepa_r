# Control: every image contains an object (no entity-vs-none shortcut),
# testing whether a circle/square/triangle split still emerges.
# Smoke-test config for the rendered-image temporal world (Section 2.4).
# `python scripts/train_temporal_image.py experiment=temporal_hierarchy_image_quick`
dataset_type: static_image_spatial_control

data:
  image_size: 64
  num_channels: 3
  trajectory_length: 16
  entity_switch_probability: 0.05
  context_smoothness: 0.85
  visibility_change_probability: 0.1
  background_change_probability: 0.05
  num_train_trajectories: 300
  num_val_trajectories: 60
  num_test_trajectories: 60
  num_train_samples: 300
  num_val_samples: 60
  num_test_samples: 60
  system_seed: 123
  train_sample_seed: 1000
  validation_sample_seed: 2000
  test_sample_seed: 3000
  counterfactual_seed: 4000

model:
  kind: standard
  architecture: linear
  latent_dim: 32
  hidden_dim: 64
  hidden_layers: 1
  entity_latent_dim: 8
  context_latent_dim: 24

training:
  seed: 0
  learning_rate: 0.001
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  batch_size: 32
  epochs: 5
  device: auto
  stop_gradient: true
  ema:
    enabled: true
    decay: 0.99
  prediction_horizon: 4
  target_pairing: temporal  # unused for static datasets
  evaluation_every_epochs: 1
  checkpoint_every_epochs: 5

hierarchical:
  short_horizon: 1
  long_horizon: 8
  lambda_entity: 1.0
  lambda_context: 1.0
  lambda_var: 1.0
  lambda_cross: 1.0
  variance_gamma: 1.0
  use_horizon_split: true
  use_variance_reg: true
  use_cross_cov_reg: true
  epsilon: 1.0e-6

evaluation:
  entity_subspace_dims: [1, 2, 4, 8]
  covariance_epsilon: 1.0e-6
  probe_ridge: 1.0e-6
  autocorrelation_max_lag: 8
  counterfactual_pairs: 100
  selectivity_alpha: 1.0

spatial:
  masking_strategy: block
  block_fraction: 0.25

output:
  root: outputs/spatial_semantics_image_quick_control
  overwrite: true
